<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- FixPose launcher icon — adaptive foreground layer (108dp canvas).
     Transparent; glyph sized to stay inside the 66% safe zone. -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,450,1,0&display=block" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    width: 1024px; height: 1024px;
    display: grid; place-items: center;
  }
  .glyph {
    font-family: 'Material Symbols Rounded';
    font-weight: normal; font-style: normal;
    line-height: 1; letter-spacing: normal; text-transform: none;
    font-size: 512px;
    color: #1c2a06;
    font-variation-settings: 'FILL' 1, 'wght' 450, 'GRAD' 0, 'opsz' 24;
    -webkit-font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>
  <span class="glyph">accessibility_new</span>
</body>
</html>
