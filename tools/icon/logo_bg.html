<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- FixPose launcher icon — adaptive background layer (108dp canvas, full bleed).
     System mask crops the corners; keep it edge-to-edge. -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .tile {
    width: 1024px; height: 1024px;
    background: linear-gradient(160deg, #d9ff57, #7cc414);
    box-shadow: inset 0 8px 18px rgba(255, 255, 255, 0.28);
  }
</style>
</head>
<body>
  <div class="tile"></div>
</body>
</html>
