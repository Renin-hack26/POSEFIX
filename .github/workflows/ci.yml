name: FixPose CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Verify no generated files committed incorrectly
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Analyze (must be 0 issues)
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Asset size budget (instruction videos <= 3MB each)
        run: |
          oversized=$(find assets/videos -type f -size +3M 2>/dev/null | wc -l)
          if [ "$oversized" -gt 0 ]; then
            echo "Files over 3MB budget:"; find assets/videos -type f -size +3M; exit 1
          fi

  build-apk:
    if: startsWith(github.ref, 'refs/tags/')
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fixpose-apk
          path: build/app/outputs/flutter-apk/app-release.apk
