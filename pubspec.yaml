publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.4
  camera: ^0.12.1
  cloud_firestore: ^6.10.0
  csv: ^8.0.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  fl_chart: ^1.2.0
  flutter_local_notifications: ^8.2.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  google_mlkit_pose_detection: ^0.16.1
  hive_flutter: ^1.1.0
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  lottie: ^3.6.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  rive: ^0.14.11
  share_plus: ^13.3.0
  timezone: ^0.8.0
  video_player: ^2.14.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/animations/
    - assets/avatars/
    - assets/images/
    - assets/tips/
