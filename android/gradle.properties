# -Djava.net.preferIPv4Stack=true: Java connects IPv6-first on this machine and
# times out (curl works) — required for wrapper + daemon downloads.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# WS1 build fix: plugin subprojects (flutter_timezone, workmanager) compile
# Kotlin at JVM 1.8 while Flutter's Java tasks target 11 — Gradle 9 hard-fails
# on the mismatch. The 1.8/11 bytecode is fully compatible on Android (D8
# consumes both), so downgrade the validation to a warning instead of a build
# error.
kotlin.jvm.target.validation.mode=warning
